# Nginx reverse proxy for ExposeChain
# Install to: /etc/nginx/sites-available/webstocking.com
# Then: ln -s /etc/nginx/sites-available/webstocking.com /etc/nginx/sites-enabled/
#
# NOTE: This is the pre-SSL version. Certbot will automatically rewrite this
# file to add the SSL server block and HTTP->HTTPS redirect when you run
# `certbot --nginx`. Do not hand-edit the SSL parts after that; let certbot own them.

server {
    listen 80;
    listen [::]:80;
    server_name webstocking.com www.webstocking.com;

    client_max_body_size 2M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
