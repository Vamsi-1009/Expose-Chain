# Nginx reverse proxy for ExposeChain
# Install to: /etc/nginx/sites-available/webstocking.com
# Then: ln -s /etc/nginx/sites-available/webstocking.com /etc/nginx/sites-enabled/
#
# NOTE: This is the pre-SSL version. Certbot will automatically rewrite this
# file to add the SSL server block and HTTP->HTTPS redirect when you run
# `certbot --nginx`. Do not hand-edit the SSL parts after that; let certbot own them.

server {
    listen 80;
    listen [::]:80;
    server_name webstocking.com www.webstocking.com;

    client_max_body_size 2M;

    # Hide Nginx version from the Server header
    server_tokens off;

    # Security headers. Note: HSTS is intentionally NOT set here - it must
    # only be sent over HTTPS (browsers ignore it on plain HTTP anyway).
    # Certbot's `--nginx` run adds an HTTPS server block; add
    # `add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;`
    # to that HTTPS block once TLS is active, not to this one.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "0" always;

    # Root path is intentionally not served - only /exposechain/ works.
    # Everything else (API calls, /health, /docs, /static, etc) still falls
    # through to the location / block below, since an exact match (=) takes
    # priority over a prefix match in Nginx regardless of block order.
    location = / {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Serve the same app under /exposechain/ too.
    # Trailing slash on proxy_pass strips the /exposechain/ prefix before
    # forwarding, so the app still sees "/" and returns its normal index page.
    # The app's frontend calls absolute paths like /api/scan, which the
    # location / block above already proxies to the same backend.
    location = /exposechain {
        return 301 /exposechain/;
    }

    location /exposechain/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
